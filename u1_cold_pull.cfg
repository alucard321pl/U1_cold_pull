# Guided cold pull for Snapmaker U1; manual extraction (no cold motor move).
# Adapted from MMU_COLD_PULL as distributed in Happy Hare.
# Upstream file copyright notice: (C) 2022-2026 moggieuk.
# This file-level notice does not establish the macro's original authorship.
# SPDX-License-Identifier: GPL-3.0-only
# Source: https://github.com/moggieuk/Happy-Hare/blob/main/config/macros/mmu_misc.cfg
# Reviewed against Snapmaker/u1-klipper 10f2f69714c059f1dee0423db4f515b8a01f5388.
# Select and mount a tool BEFORE preparing filament and starting this macro.
# See README.md. No [respond] or [force_move] required.

[gcode_macro SM_COLD_PULL]
description: Guided cold pull on the mounted U1 tool; pull filament by hand
gcode:
    {% set allowed = ['MATERIAL', 'HOT_TEMP', 'COLD_TEMP', 'PULL_TEMP', 'MIN_EXTRUDE_TEMP', 'CLEAN_LENGTH', 'EXTRUDE_SPEED'] %}
    {% for key in params %}
        {% if key not in allowed %}
            {action_raise_error('Unknown parameter: ' ~ key)}
        {% endif %}
    {% endfor %}
    {% set material = params.MATERIAL|default('PLA')|upper %}
    {% set profiles = {'PLA': [250,45,100,160], 'PETG': [250,45,100,180], 'ABS': [255,50,120,190], 'NYLON': [260,50,120,190]} %}
    {% if material not in profiles %}
        {action_raise_error('MATERIAL: PLA, PETG, ABS or NYLON')}
    {% endif %}
    {% set p = profiles[material] %}
    {% set hot = params.HOT_TEMP|default(p[0])|float %}
    {% set cold = params.COLD_TEMP|default(p[1])|float %}
    {% set pull = params.PULL_TEMP|default(p[2])|float %}
    {% set stuff = params.MIN_EXTRUDE_TEMP|default(p[3])|float %}
    {% set length = params.CLEAN_LENGTH|default(25)|int %}
    {% set speed = params.EXTRUDE_SPEED|default(1.5)|float %}
    {% set ext = printer.toolhead.extruder %}
    {% if ext not in ['extruder', 'extruder1', 'extruder2', 'extruder3'] %}
        {action_raise_error('Select and mount a U1 tool first.')}
    {% endif %}
    {% if 'print_stats' in printer and printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Finish or cancel the print before cold pull.')}
    {% endif %}
    {% if 'machine_state_manager' in printer and printer.machine_state_manager.main_state|string != 'IDLE' %}
        {action_raise_error('The U1 must be idle before cold pull.')}
    {% endif %}
    {% if 'xyz' != printer.toolhead.homed_axes or printer.toolhead.position.z < 20 %}
        {action_raise_error('Home first, then position the tool clear of the bed, Z >= 20 mm.')}
    {% endif %}
    {% set actual = printer[ext].real_extruder_stats|default(['unknown', 2]) %}
    {% if actual[0] != ext or actual[1] != 0 %}
        {action_raise_error('Selected tool is not confirmed mounted. Select it normally first.')}
    {% endif %}
    {% set cfg = printer.configfile.settings[ext] %}
    {% set threshold = cfg.min_extrude_temp|default(170)|float %}
    {% set cutoff = [stuff, threshold + 10]|max %}
    {% if not (30 <= cold and cold < pull and pull < cutoff and cutoff < hot and hot <= cfg.max_temp|float - 5) %}
        {action_raise_error('Invalid temperatures: 30 <= COLD < PULL < stuffing cutoff < HOT <= max_temp - 5 required.')}
    {% endif %}
    {% if not (1 <= length <= 100 and 0 < speed <= 5) %}
        {action_raise_error('Use CLEAN_LENGTH=1..100 mm and EXTRUDE_SPEED > 0..5 mm/s.')}
    {% endif %}
    {% if cfg.max_extrude_only_distance|default(50)|float < 1 %}
        {action_raise_error('Extruder must allow at least 1 mm extrusion moves.')}
    {% endif %}
    {% set fan = printer.fan.speed|float %}

    _SM_CP_MESSAGE MSG="Cold pull: {ext}, {material}. Heating to {hot} C. Keep filament accessible."
    SAVE_GCODE_STATE NAME=SM_COLD_PULL_STATE
    M83
    M220 S100
    M221 S100
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={hot}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={hot - 2} MAXIMUM={hot + 2}
    _SM_CP_MESSAGE MSG="Purging {length} mm of filament."
    {% for n in range(length) %}
        G1 E1 F{speed * 60}
    {% endfor %}
    M400
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
    M106 S255
    _SM_CP_MESSAGE MSG="Cooling; topping up nozzle only above {cutoff} C."
    {% for t in range(hot|int, cutoff|int, -1) %}
        {% if t % 10 == 0 %}
            TEMPERATURE_WAIT SENSOR={ext} MAXIMUM={t}
            _SM_CP_STUFF EXTRUDER={ext} CUTOFF={cutoff} SPEED={speed}
        {% endif %}
    {% endfor %}
    TEMPERATURE_WAIT SENSOR={ext} MAXIMUM={cutoff}
    M400
    RESTORE_GCODE_STATE NAME=SM_COLD_PULL_STATE MOVE=0
    M106 S255
    _SM_CP_MESSAGE MSG="No more motor moves. Leave filament in place while the nozzle cools."
    TEMPERATURE_WAIT SENSOR={ext} MAXIMUM={cold}
    M107
    _SM_CP_MESSAGE MSG="Press the lever and get ready to pull. Hold the extruder release lever while reheating to {pull} C; wait for PULL NOW."
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={pull}
    TEMPERATURE_WAIT SENSOR={ext} MINIMUM={pull}
    _SM_CP_MESSAGE MSG="PULL NOW by hand, steadily upward. Heater off. Inspect the nozzle impression on the tip."
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
    M106 S{fan * 255}

# Separate macros deliberately evaluate at execution time, after temperature waits.
[gcode_macro _SM_CP_STUFF]
gcode:
    {% set ext = params.EXTRUDER %}
    {% if printer.toolhead.extruder != ext %}
        SET_HEATER_TEMPERATURE HEATER={ext} TARGET=0
        _SM_CP_FAIL
    {% elif printer[ext].can_extrude and printer[ext].temperature|float > params.CUTOFF|float %}
        G1 E1 F{params.SPEED|float * 60}
        M400
    {% endif %}

[gcode_macro _SM_CP_FAIL]
gcode:
    {action_raise_error('Active tool changed during cold pull. Procedure stopped.')}

[gcode_macro _SM_CP_MESSAGE]
gcode:
    {action_respond_info(params.MSG)}
